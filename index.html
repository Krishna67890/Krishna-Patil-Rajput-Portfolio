<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Points to the file in the public folder -->
    <link rel="icon" type="image/jpeg" href="/Krishna logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Krishna Patil Rajput - Full-Stack & Game Developer Portfolio" />
    <title>Krishna Patil Rajput | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      html, body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      [data-theme='light'], [data-theme='light'] body {
        background-color: #f8fafc;
        color: #0f172a;
      }
      #root {
        min-height: 100vh;
        background-color: transparent;
      }
    </style>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
